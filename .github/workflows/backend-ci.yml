      - name: Start backend (uvicorn) in background
        run: |
          echo "Setting PYTHONPATH to include backend package dirs"
          echo "PYTHONPATH=$PWD/compliance_tool/backend:$PWD/compliance-tool/backend" >> $GITHUB_ENV
          export PYTHONPATH="$PWD/compliance_tool/backend:$PWD/compliance-tool/backend:$PYTHONPATH"
          echo "PYTHONPATH is: $PYTHONPATH"
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 > server.log 2>&1 &
          echo "waiting for server to be healthy..."
          for i in $(seq 1 30); do
            sleep 1
            if curl -sS --max-time 2 http://127.0.0.1:8000/ >/dev/null; then
              echo "server is up"
              break
            fi
            echo "waiting... ($i)"
          done
          tail -n +1 server.log | sed -n '1,200p'
