name: Backend CI (pytest in-process)

on:
  push:
    branches: ["dev-test"]
  pull_request:
    branches: ["main-test"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f compliance_tool/backend/requirements.txt ]; then pip install -r compliance_tool/backend/requirements.txt; fi
          pip install pytest httpx fastapi[all]  # installs TestClient + httpx

      - name: (PR only) Ensure CHANGELOG updated
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_BRANCH --depth=1
          CHANGED=$(git diff --name-only origin/$BASE_BRANCH...${{ github.sha }} || true)
          echo "$CHANGED" | grep -qE '^CHANGELOG\.md$' || (echo "CHANGELOG.md not modified in this PR. Please update CHANGELOG.md" && exit 1)

      - name: Run pytest (backend tests)
        run: |
          pytest backend/tests -q

      - name: Run Bandit (quick)
        run: |
          bandit -r compliance_tool/backend || true

      - name: Run pip-audit (dependencies)
        run: |
          pip-audit || true
