name: Docker CI (backend)

on:
  push:
    branches: [ "dev-test", "main-test", "main" ]
  pull_request:
    branches: [ "dev-test", "main-test", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for buildx, optional)
        uses: docker/setup-qemu-action@v2

      - name: Set up Buildx (optional)
        uses: docker/setup-buildx-action@v2

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-lockfile-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Build Docker image (backend context)
        run: |
          docker build -t backend-ci -f backend/Dockerfile backend

      - name: Run tests inside container
        run: docker run --rm backend-ci

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-logs
          path: |
            ./logs || true
