<!doctype html>
<html>
  <body style="font-family:Arial,Helvetica,sans-serif; background:#f6f7fb; padding:24px;">
    <div style="max-width:560px; margin:auto; background:#fff; border-radius:12px; padding:24px;">
      <h2>Your account is ready</h2>
      <p>Hi {{ full_name or "there" }},</p>
      <p>Your login credentials are:</p>
      <div style="background:#0f172a; color:#fff; padding:12px 16px; border-radius:8px;">
        <div><strong>Email:</strong> {{ email }}</div>
        <div><strong>Password:</strong> {{ password }}</div>
      </div>
      <p style="margin-top:12px;">For security, consider changing your password after first login.</p>
      <hr style="border:none;border-top:1px solid #eee;">
      <p style="font-size:12px;color:#999;">If you didn’t sign up, ignore this email.</p>
    </div>
  </body>
</html>
